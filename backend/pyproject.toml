[project]
name = "trello-backend"
version = "0.1.0"
description = "Trello 형식 칸반 보드 API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "pydantic[email]>=2",
    "pydantic-settings>=2.16.3",
    "pymysql>=1.2.4",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.4.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
